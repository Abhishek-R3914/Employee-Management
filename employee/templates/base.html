{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold fs-4"
               href="{% url 'employee_list' %}">

                <i class="bi bi-people-fill"></i>
                Employee Management

            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbarNav">

                <ul class="navbar-nav ms-auto align-items-center">

                    <li class="nav-item">

                        <a class="nav-link {% if request.resolver_match.url_name == 'employee_list' %}active{% endif %}"
                           href="{% url 'employee_list' %}">

                            <i class="bi bi-list-ul"></i>
                            Employees

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link {% if request.resolver_match.url_name == 'add_employee' %}active{% endif %}"
                           href="{% url 'add_employee' %}">

                            <i class="bi bi-person-plus-fill"></i>
                            Add Employee

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link {% if request.resolver_match.url_name == 'active_employees' %}active{% endif %}"
                           href="{% url 'active_employees' %}">

                            <i class="bi bi-check-circle-fill"></i>
                            Active Employees

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Main Content -->
    <div class="container py-4">

        {% block content %}
        {% endblock %}

    </div>

    <!-- Footer -->
    <footer class="bg-white text-center py-3 shadow-sm mt-5">

        <p class="mb-0 text-muted">
            © 2026 Employee Management System
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
